<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading Wiki</title>
<style>
:root{
  /* Apple HIG light set, copied from index.html's tokens (light only, README "Look") */
  --bg:#F2F2F7;--paper:#FFFFFF;--ink:#1C1C1E;--ink-soft:#3C3C43;--muted:#8E8E93;--rule:#E5E5EA;
  --blue-ink:#0040DD;--critical:#D70015;--print-ink:#222222;
  --sans:-apple-system,BlinkMacSystemFont,"San Francisco","Helvetica Neue",Helvetica,Ubuntu,Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:2;background:var(--paper);border-bottom:1px solid var(--rule)}
header .bar{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header strong{font-size:16px;margin-right:auto}
a{color:var(--blue-ink);text-decoration:none}
a:hover{text-decoration:underline}
main{max-width:760px;margin:0 auto;padding:16px}
article{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:18px 20px;overflow-wrap:anywhere}
article h1{font-size:22px;margin:0 0 10px;letter-spacing:-.01em}
article h2{font-size:17px;margin:22px 0 8px}
article h3{font-size:15px;margin:18px 0 6px}
article p,article li{color:var(--ink-soft)}
article code{font-family:var(--mono);font-size:13px}
article .tbl{overflow-x:auto}
article table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}
article th,article td{padding:6px 8px;border-bottom:1px solid var(--rule);text-align:left;white-space:nowrap;overflow-wrap:normal}
article td:not(:first-child),article th:not(:first-child){text-align:right}
article blockquote{margin:8px 0;padding-left:12px;border-left:3px solid var(--rule);color:var(--muted)}
.crumb{font-size:12px;color:var(--muted);margin:0 0 8px}
.err{color:var(--critical)}
@media print{
  header{position:static}
  body{background:var(--paper)}
  article{border:0;padding:0;break-inside:avoid}
  article p,article li,.crumb{color:var(--print-ink)}
}
</style>
</head>
<body>
<header><div class="bar">
  <strong>Trading wiki</strong>
  <a href="#p=index">Index</a>
  <a href="./">Journal</a>
</div></header>
<main>
  <p class="crumb" id="crumb"></p>
  <article id="page">Loading…</article>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/18.0.14/lib/marked.umd.min.js" integrity="sha512-trN9mtGYvoySPVI909KTnwbJI9AkKPydRCV/qAsUG1+q39hhpKltEag9b5JpdjeIZn5i8IH62hHRFdbKwMFh9w==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.16/purify.min.js" integrity="sha512-flQmhkXNRQ3iUfvtdCobtpMjCb6kE+zLnTiAulAQJ3WykVfy84JvCMOo6vhwWXHTXjR25h9Zj+LyGFRWKjRoag==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
// Pages live in wiki/<path>.md; the address is wiki.html#p=<path> (a hash, so no query string reaches the server).
const SAFE = /^[A-Za-z0-9][A-Za-z0-9\-\/]*$/;   // weekly pages are e.g. weekly/2026-W41
function current(){
  const m = location.hash.match(/p=([^&]+)/);
  let p = "index";
  try{ if(m) p = decodeURIComponent(m[1]); }catch(e){ return "index"; }   // a malformed %-escape falls back too
  return SAFE.test(p) && !p.includes("..") ? p : "index";
}
function links(md){
  // [[section/page]] or [[section/page|label]] -> markdown link to #p=section/page
  return md.replace(/\[\[([^\]|#]+)(?:\|([^\]]+))?\]\]/g, (_, p, label) => {
    p = p.trim(); return `[${(label || p.split("/").pop()).trim()}](#p=${encodeURIComponent(p).replace(/%2F/g, "/")})`;
  });
}
async function show(){
  const p = current(), el = document.getElementById("page");
  document.getElementById("crumb").textContent = p === "index" ? "" : p;
  try{
    const r = await fetch(`wiki/${p}.md`, {cache: "no-store"});
    if(!r.ok) throw new Error(r.status === 404 ? "No page called " + p + " yet." : "Could not load " + p + " (" + r.status + ").");
    const html = DOMPurify.sanitize(marked.parse(links(await r.text())));
    el.innerHTML = html;
    el.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "tbl"; t.replaceWith(w); w.appendChild(t); });
    const h = el.querySelector("h1"); document.title = (h ? h.textContent + " · " : "") + "Trading Wiki";
    window.scrollTo(0, 0);
  }catch(e){
    el.innerHTML = ""; const s = document.createElement("p"); s.className = "err"; s.textContent = e.message; el.appendChild(s);
  }
}
window.addEventListener("hashchange", show);
show();
</script>
</body>
</html>
