<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading Wiki</title>
<style>
:root{--bg:#F2F2F7;--paper:#FFFFFF;--ink:#1C1C1E;--muted:#8E8E93;--rule:#E5E5EA;--blue-ink:#0040DD;
  --sans:-apple-system,BlinkMacSystemFont,"San Francisco","Helvetica Neue",Helvetica,Ubuntu,Roboto,sans-serif;color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:24px 16px}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:16px 18px}
h1{font-size:22px;margin:0 0 8px}
p{margin:0;color:var(--muted)}
a{color:var(--blue-ink)}
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Trading wiki</h1>
    <p>The wiki starts with the first compiled trading day. <a href="./">Back to the journal</a></p>
  </div>
</main>
</body>
</html>
